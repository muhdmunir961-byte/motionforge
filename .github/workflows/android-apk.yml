name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android packages
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - name: Build Android APK
        run: |
          npm install --no-audit --no-fund
          python3 - <<'PY'
          import os, struct, zlib
          os.makedirs('src-tauri/icons', exist_ok=True)
          size=512
          def chunk(tag, data):
              return struct.pack('!I', len(data))+tag+data+struct.pack('!I', zlib.crc32(tag+data)&0xffffffff)
          pixels=[]
          for y in range(size):
              row=bytearray([0])
              for x in range(size):
                  bg=(27,27,25,255)
                  # Geometric brass M mark inside a dark square.
                  stem=(x in range(126,169) or x in range(342,385)) and 133<=y<=379
                  diagonals=(130<=y<=300 and (abs(x-(147+(y-133)*1.08))<23 or abs(x-(363-(y-133)*1.08))<23))
                  row.extend((199,162,124,255) if (stem or diagonals) else bg)
              pixels.append(row)
          payload=b''.join(pixels)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('!2I5B',size,size,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(payload,9))+chunk(b'IEND',b'')
          open('src-tauri/icons/icon.png','wb').write(png)
          PY
          npx tauri icon src-tauri/icons/icon.png
          npx tauri android init --ci
          npx tauri android build --apk --debug --ci
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionForge-Android-debug-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Release APK on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" MotionForge-Android-debug.apk
          gh release create "$GITHUB_REF_NAME" MotionForge-Android-debug.apk --title "MotionForge $GITHUB_REF_NAME" --notes "Experimental debug APK."
